<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="larynxBgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#15263a"/>
      <stop offset="60%" stop-color="#0a121e"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- 3D Blue Spot -->
    <radialGradient id="larynxSpot" cx="50%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Cartilage Gradients (Amber-Blue-Ivory 3D shading) -->
    <linearGradient id="thyroidGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="25%" stop-color="#60a5fa"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="thyroidRightGrad" x1="100%" y1="0%" x2="0%" y2="80%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="25%" stop-color="#60a5fa"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="epiglottisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="cricoidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <radialGradient id="vocalCordGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </radialGradient>

    <filter id="larynxShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="cordGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#larynxBgGrad)"/>
  <ellipse cx="400" cy="230" rx="320" ry="190" fill="url(#larynxSpot)"/>

  <!-- Unlabeled 3D Medical Axis Guidelines -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="400" y1="30" x2="400" y2="450"/>
    <ellipse cx="400" cy="240" rx="220" ry="160" fill="none" stroke-dasharray="6 6"/>
  </g>

  <!-- LARINX 3D STRUCTURE -->
  <g filter="url(#larynxShadow)">
    <!-- 1. Hyoid Bone Arch (Tulang Lidah di bagian atas) -->
    <path d="M 280,75 C 330,60 470,60 520,75 C 530,95 515,105 505,100 C 460,88 340,88 295,100 C 285,105 270,95 280,75 Z" 
          fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>

    <!-- Thyrohyoid Membrane (Membran elastis tipis) -->
    <path d="M 300,95 C 350,90 450,90 500,95 L 490,150 C 450,145 350,145 310,150 Z" 
          fill="#f43f5e" opacity="0.45"/>

    <!-- 2. Epiglottis (Katup Pangkal Tenggorok / Daun Pelindung Laring) -->
    <path d="M 400,65 C 365,65 350,105 355,160 C 375,175 425,175 445,160 C 450,105 435,65 400,65 Z" 
          fill="url(#epiglottisGrad)" stroke="#fcd34d" stroke-width="1.5"/>

    <!-- 3. Thyroid Cartilage (Kartilago Tiroid / Jakun - Perisai Utama Laring) -->
    <!-- Left Lamina -->
    <path d="M 400,165 
             C 385,160 310,170 270,160 
             C 260,195 265,275 285,300 
             C 320,305 385,280 400,285 Z" 
          fill="url(#thyroidGrad)" stroke="#60a5fa" stroke-width="2"/>

    <!-- Right Lamina -->
    <path d="M 400,165 
             C 415,160 490,170 530,160 
             C 540,195 535,275 515,300 
             C 480,305 415,280 400,285 Z" 
          fill="url(#thyroidRightGrad)" stroke="#60a5fa" stroke-width="2"/>

    <!-- Anterior Prominence (Tonjolan Jakun / Laryngeal Prominence) -->
    <path d="M 400,165 L 400,285" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <!-- Superior Notch -->
    <path d="M 380,160 C 400,175 400,175 420,160" fill="none" stroke="#ffffff" stroke-width="2"/>

    <!-- Superior & Inferior Cornua (Tanduk Atas & Bawah Kartilago Tiroid) -->
    <path d="M 270,160 C 265,130 272,110 278,110 C 285,110 280,135 280,160 Z" fill="#93c5fd"/>
    <path d="M 530,160 C 535,130 528,110 522,110 C 515,110 520,135 520,160 Z" fill="#93c5fd"/>
    <path d="M 285,300 C 280,320 282,335 288,335 C 295,335 292,315 295,300 Z" fill="#60a5fa"/>
    <path d="M 515,300 C 520,320 518,335 512,335 C 505,335 508,315 505,300 Z" fill="#60a5fa"/>

    <!-- 4. PITA SUARA & CELAH GLOTTIS (CUTAWAY / 3D INTERNAL REVEAL) -->
    <!-- Window cutout into interior vocal cords -->
    <g filter="url(#cordGlow)">
      <!-- Laryngeal Interior Darkness -->
      <ellipse cx="400" cy="225" rx="65" ry="38" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
      
      <!-- True Vocal Cords (Vocal Folds - Pita Suara Elastis Berwarna Putih Mutiara) -->
      <!-- Left Cord -->
      <path d="M 400,195 C 385,210 365,225 350,230 C 375,228 395,215 400,205 Z" 
            fill="url(#vocalCordGlow)" stroke="#ffffff" stroke-width="1.5"/>
      <!-- Right Cord -->
      <path d="M 400,195 C 415,210 435,225 450,230 C 425,228 405,215 400,205 Z" 
            fill="url(#vocalCordGlow)" stroke="#ffffff" stroke-width="1.5"/>

      <!-- Vocal Cord Vibration Wave Lines (Representing Sound / Voice) -->
      <path d="M 370,225 Q 400,215 430,225" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.9"/>
      <path d="M 375,232 Q 400,223 425,232" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.8"/>
    </g>

    <!-- 5. Cricoid Cartilage (Cincin Kartilago Krikoid di Bawah Tiroid) -->
    <path d="M 310,310 
             C 345,305 455,305 490,310 
             C 485,340 455,350 400,350 
             C 345,350 315,340 310,310 Z" 
          fill="url(#cricoidGrad)" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- 6. Upper Trachea Rings (Cincin Tulang Rawan Awal Batang Tenggorok) -->
    <!-- Ring 1 -->
    <path d="M 325,358 C 360,352 440,352 475,358 C 470,380 440,388 400,388 C 360,388 330,380 325,358 Z" 
          fill="#64748b" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 340,366 C 370,362 430,362 460,366" fill="none" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Ring 2 -->
    <path d="M 330,394 C 365,390 435,390 470,394 C 465,415 440,422 400,422 C 360,422 335,415 330,394 Z" 
          fill="#475569" stroke="#64748b" stroke-width="1.5"/>
    <path d="M 345,402 C 375,398 425,398 455,402" fill="none" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <!-- Clean Subtle 3D Glass Vignette Ring -->
  <rect x="12" y="12" width="776" height="456" rx="28" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>
</svg>

