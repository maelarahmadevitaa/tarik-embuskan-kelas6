<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#15263a"/>
      <stop offset="60%" stop-color="#0a121e"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- 3D Lighting Spot -->
    <radialGradient id="spotLight" cx="50%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Diaphragm Dome Muscle Gradients -->
    <linearGradient id="muscleGradLeft" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#e05260"/>
      <stop offset="30%" stop-color="#c92a3e"/>
      <stop offset="70%" stop-color="#991b2c"/>
      <stop offset="100%" stop-color="#590d18"/>
    </linearGradient>

    <linearGradient id="muscleGradRight" x1="100%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="#e05260"/>
      <stop offset="30%" stop-color="#c92a3e"/>
      <stop offset="70%" stop-color="#991b2c"/>
      <stop offset="100%" stop-color="#590d18"/>
    </linearGradient>

    <radialGradient id="centralTendonGrad" cx="48%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>

    <!-- Dome 3D Highlight Curve -->
    <linearGradient id="domeRimHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fca5a5" stop-opacity="0"/>
      <stop offset="25%" stop-color="#fecdd3" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#fecdd3" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fca5a5" stop-opacity="0"/>
    </linearGradient>

    <!-- Deep Shadow under the dome -->
    <radialGradient id="subDomeShadow" cx="50%" cy="75%" r="60%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Costal Rim Outline (Boundary between thorax & abdomen) -->
    <linearGradient id="ribRimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Filter for 3D Muscle Glow & Depth -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>
  <ellipse cx="400" cy="220" rx="360" ry="200" fill="url(#spotLight)"/>

  <!-- Subtle Thorax Cavity Grid / Blueprint (clean, unlabeled) -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="240" x2="700" y2="240"/>
    <line x1="400" y1="50" x2="400" y2="430"/>
    <ellipse cx="400" cy="240" rx="280" ry="170" fill="none" stroke-dasharray="6 6"/>
  </g>

  <!-- Deep Under-Dome Cavity Shadow -->
  <ellipse cx="400" cy="350" rx="310" ry="85" fill="url(#subDomeShadow)"/>

  <!-- Lower Rib Cage Arch (Anatomical frame for diaphragm base, no labels) -->
  <g stroke="url(#ribRimGrad)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.45">
    <path d="M 120,380 C 140,290 190,200 280,165" />
    <path d="M 680,380 C 660,290 610,200 520,165" />
    <path d="M 160,395 C 220,340 310,320 400,320 C 490,320 580,340 640,395" stroke-dasharray="8 6"/>
  </g>

  <!-- MAIN 3D DIAPHRAGM DOME (Otot Sekat Kubah Pernapasan) -->
  <g filter="url(#dropShadow)">
    <!-- Base Dome Muscle Mass (Dual Hemidiaphragm Arches) -->
    <path d="M 140,370 
             C 145,280 180,150 285,120 
             C 340,105 375,130 400,135 
             C 425,130 460,105 515,120 
             C 620,150 655,280 660,370 
             C 590,360 520,335 465,345 
             C 430,352 400,385 400,385 
             C 400,385 370,352 335,345 
             C 280,335 210,360 140,370 Z" 
          fill="url(#muscleGradLeft)"/>

    <!-- Right Hemidiaphragm Depth Overlay -->
    <path d="M 400,135 
             C 425,130 460,105 515,120 
             C 620,150 655,280 660,370 
             C 590,360 520,335 465,345 
             C 430,352 400,385 400,385 Z" 
          fill="url(#muscleGradRight)" opacity="0.95"/>

    <!-- 3D Radiating Muscle Fibers (Serat Otot Melengkung ke Bawah) -->
    <g stroke="#f87171" stroke-width="1.8" opacity="0.45" stroke-linecap="round">
      <!-- Left dome fibers -->
      <path d="M 330,190 C 260,205 195,260 160,350"/>
      <path d="M 320,175 C 245,190 180,240 175,325"/>
      <path d="M 310,165 C 230,180 185,225 195,305"/>
      <path d="M 305,155 C 245,160 215,200 220,290"/>
      <path d="M 320,145 C 275,150 245,190 250,285"/>
      <path d="M 345,145 C 310,155 285,205 290,295"/>
      <path d="M 365,155 C 350,175 330,225 330,320"/>

      <!-- Right dome fibers -->
      <path d="M 470,190 C 540,205 605,260 640,350"/>
      <path d="M 480,175 C 555,190 620,240 625,325"/>
      <path d="M 490,165 C 570,180 615,225 605,305"/>
      <path d="M 495,155 C 555,160 585,200 580,290"/>
      <path d="M 480,145 C 525,150 555,190 550,285"/>
      <path d="M 455,145 C 490,155 515,205 510,295"/>
      <path d="M 435,155 C 450,175 470,225 470,320"/>

      <!-- Posterior Crura (Pilar Penyangga Diafragma ke Tulang Belakang) -->
      <path d="M 380,230 C 375,270 370,320 375,370" stroke-width="2.5" stroke="#fda4af"/>
      <path d="M 420,230 C 425,270 430,320 425,370" stroke-width="2.5" stroke="#fda4af"/>
    </g>

    <!-- CENTRAL TENDON (Centrum Tendineum - Daun Tendon Putih Mengkilap) -->
    <!-- Distinctive 3-leaflet cloverleaf shape (anterior, right, left leaflets) -->
    <g filter="url(#dropShadow)">
      <path d="M 400,150 
               C 365,150 335,160 310,185 
               C 285,210 290,245 325,245 
               C 350,245 365,230 380,235 
               C 390,238 395,255 400,255 
               C 405,255 410,238 420,235 
               C 435,230 450,245 475,245 
               C 510,245 515,210 490,185 
               C 465,160 435,150 400,150 Z" 
            fill="url(#centralTendonGrad)" 
            stroke="#ffffff" 
            stroke-width="1.5"/>

      <!-- Fibrous Glisten & Collagen Structure on Tendon -->
      <path d="M 335,195 C 370,185 430,185 465,195" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8"/>
      <path d="M 345,210 C 380,200 420,200 455,210" stroke="#f1f5f9" stroke-width="1.5" fill="none" opacity="0.7"/>
      <path d="M 390,165 C 400,190 400,220 400,240" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.85"/>
    </g>

    <!-- Anatomical Apertures (Lubang Alami Diafragma, Polos Tanpa Label) -->
    <!-- 1. Vena Caval Foramen (Lubang Vena Cava Inferior pada tendon kanan) -->
    <ellipse cx="445" cy="195" rx="11" ry="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <ellipse cx="445" cy="195" rx="8" ry="6" fill="#090d16"/>

    <!-- 2. Esophageal Hiatus (Celah Esofagus di antara pilar otot) -->
    <ellipse cx="400" cy="275" rx="10" ry="14" fill="#3b0712" stroke="#991b1b" stroke-width="1.5"/>
    <ellipse cx="400" cy="275" rx="7" ry="11" fill="#1f0207"/>

    <!-- 3. Aortic Hiatus (Celah Aorta di bagian paling bawah) -->
    <ellipse cx="400" cy="335" rx="12" ry="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.5"/>
    <ellipse cx="400" cy="335" rx="9" ry="6" fill="#0f172a"/>

    <!-- TOP CURVED DOME CREST 3D SPECULAR HIGHLIGHT -->
    <!-- Beautiful glowing crest emphasizing the curved dome separation -->
    <path d="M 170,300 
             C 185,210 215,145 285,120 
             C 338,103 372,128 400,132 
             C 428,128 462,103 515,120 
             C 585,145 615,210 630,300" 
          fill="none" 
          stroke="url(#domeRimHighlight)" 
          stroke-width="5" 
          stroke-linecap="round"
          filter="url(#softGlow)"/>

    <path d="M 230,160 C 265,128 320,112 360,118" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9" stroke-linecap="round"/>
    <path d="M 440,118 C 480,112 535,128 570,160" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9" stroke-linecap="round"/>
  </g>

  <!-- Depth Gradients for Right/Left Hypochondrium Under Dome -->
  <g opacity="0.25">
    <ellipse cx="260" cy="260" rx="60" ry="35" fill="#f43f5e" filter="url(#softGlow)"/>
    <ellipse cx="540" cy="260" rx="60" ry="35" fill="#f43f5e" filter="url(#softGlow)"/>
  </g>

  <!-- Clean Subtle 3D Glass Vignette Ring -->
  <rect x="12" y="12" width="776" height="456" rx="28" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>
</svg>

